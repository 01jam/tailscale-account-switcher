[package]
name = "tailscale-switch"
version = "0.1.1"
description = "Switch between the Tailscale accounts on this computer"
authors = ["Hund Studio"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[lib]
name = "tailscale_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
# The update check and the package download. rustls rather than native-tls: one
# less system library to have installed. The daemon itself is never spoken to
# over HTTP from here — its API is a Unix socket, handled in `localapi.rs`.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "sync",
    "time",
] }
# Writes the XDG autostart entry (and the equivalent elsewhere) rather than us
# hand-rolling the desktop file.
tauri-plugin-autostart = "2"
# One app, however many times its icon is clicked.
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# System language, for the automatic UI-language choice. Reads the platform API
# rather than $LANG, which GUI sessions on macOS do not set.
sys-locale = "0.3"
serde_yaml_ng = "0.10.0"

[target.'cfg(unix)'.dependencies]
# The uid of this process, compared against the daemon's to decide whether a
# change needs root.
libc = "0.2"

# Two things the cross-platform layer cannot express on GTK: blocking the window
# manager's own fullscreen, and the NVIDIA rendering workaround. Pinned to the
# version Tauri itself links, or the window handle would be a different type.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
